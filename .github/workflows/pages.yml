name: Build and deploy tailuge billiards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify vendored upstream and GPL license
        run: |
          test -f vendor/tailuge-billiards/LICENSE
          test -f vendor/tailuge-billiards/README.md
          test -f vendor/tailuge-billiards/package.json
          test -f vendor/tailuge-billiards/yarn.lock
          test -f vendor/tailuge-billiards/dist/index.html
          grep -q "GNU GENERAL PUBLIC LICENSE" vendor/tailuge-billiards/LICENSE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Enable Corepack
        run: corepack enable

      - name: Install upstream dependencies
        working-directory: vendor/tailuge-billiards
        run: yarn install --immutable

      - name: Build upstream project
        working-directory: vendor/tailuge-billiards
        run: yarn build

      - name: Verify generated browser bundle
        run: |
          test -f vendor/tailuge-billiards/dist/index.js
          test -f vendor/tailuge-billiards/dist/three_core.js
          test -f vendor/tailuge-billiards/dist/three_module.js
          test -f vendor/tailuge-billiards/dist/three_examples.js
          test -f vendor/tailuge-billiards/dist/messaging.js

      - name: Stage Snooker Lite side-by-side preview
        run: |
          rm -rf vendor/tailuge-billiards/dist/lite
          cp -R lite vendor/tailuge-billiards/dist/lite
          test -f vendor/tailuge-billiards/dist/lite/index.html
          test -f vendor/tailuge-billiards/dist/lite/src/main.mjs
          test -f vendor/tailuge-billiards/dist/lite/NOTICE.md

      - name: Upload built site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: vendor/tailuge-billiards/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
