name: Deploy tailuge billiards to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify vendored upstream and GPL license
        run: |
          test -f vendor/tailuge-billiards/LICENSE
          test -f vendor/tailuge-billiards/README.md
          test -f vendor/tailuge-billiards/dist/index.html
          test -f vendor/tailuge-billiards/dist/index.js
          grep -q "GNU GENERAL PUBLIC LICENSE" vendor/tailuge-billiards/LICENSE
          echo "Vendored tailuge/billiards dist is ready for deployment."

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload upstream static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: vendor/tailuge-billiards/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
