name: Import tailuge billiards upstream

on:
  push:
    branches: [import/tailuge-billiards]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[vendor import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone pinned upstream source
        run: |
          rm -rf /tmp/tailuge-billiards
          git clone https://github.com/tailuge/billiards.git /tmp/tailuge-billiards
          git -C /tmp/tailuge-billiards checkout f9e12476994f2f37b39d9557eb23e898d7cca332

      - name: Copy complete upstream project
        run: |
          rm -rf vendor/tailuge-billiards
          mkdir -p vendor/tailuge-billiards
          rsync -a --exclude='.git/' /tmp/tailuge-billiards/ vendor/tailuge-billiards/
          cat > UPSTREAM_IMPORT.md <<'EOF'
          # Upstream import

          This repository vendors the complete source tree of **tailuge/billiards** for evaluation and deployment.

          - Upstream: https://github.com/tailuge/billiards
          - Pinned commit: `f9e12476994f2f37b39d9557eb23e898d7cca332`
          - Upstream author/project: tailuge/billiards
          - License: GNU GPL v3.0 (see `vendor/tailuge-billiards/LICENSE`)
          - Imported: 2026-09-15

          The vendored project is preserved under its original GPL-3.0 license. Any modifications to the vendored project must remain GPL-compatible and must retain the applicable notices/source availability requirements.
          EOF

      - name: Commit vendored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/tailuge-billiards UPSTREAM_IMPORT.md
          if git diff --cached --quiet; then
            echo "No upstream changes to commit"
            exit 0
          fi
          git commit -m "[vendor import] Import tailuge/billiards f9e1247"
          git push origin HEAD:import/tailuge-billiards
